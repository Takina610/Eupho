<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/src/assets/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#01acc6" />
    <title>吹响吧！上低音号</title>
    <link rel="stylesheet" href="/src/styles/bootLoader.css" />
  </head>
  <body>
    <div id="root"></div>
    <!-- 开屏静态加载壳：放在 #root 之外，React 接管/挂起清空 #root 时它不受影响，
         由 BootGate 首次提交后移除。样式见 src/styles/bootLoader.css。 -->
    <div id="boot-shell">
      <div class="boot-overlay" aria-hidden="true">
        <div class="boot-brand">
          <img class="boot-logo" src="/src/assets/re_logo.png" alt="" />
        </div>
        <div class="boot-hud">
          <div class="boot-staff">
            <span class="boot-staff-lines"
              ><i class="boot-line" style="--start: 0"
                ><span class="boot-line-bar boot-line-bar--sweep"></span></i
              ><i class="boot-line" style="--start: 10"
                ><span class="boot-line-bar boot-line-bar--sweep"></span></i
              ><i class="boot-line" style="--start: 20"
                ><span class="boot-line-bar boot-line-bar--sweep"></span></i
              ><i class="boot-line" style="--start: 30"
                ><span class="boot-line-bar boot-line-bar--sweep"></span></i
              ><i class="boot-line" style="--start: 40"
                ><span class="boot-line-bar boot-line-bar--sweep"></span></i
              ></span
            >
            <img class="boot-clef" src="/src/assets/re_fclef.png" alt="" />
          </div>
          <div class="boot-meta">
            <p class="boot-loading">
              <i class="boot-caret"></i>LOADING - <span class="boot-count">0</span>%<span
                class="boot-dots"
                ><i></i><i></i><i></i></span
              >
            </p>
            <p class="boot-site">吹响吧！上低音号 // FAN SITE</p>
          </div>
        </div>
        <p class="boot-corner">© SOUND! EUPHONIUM</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
