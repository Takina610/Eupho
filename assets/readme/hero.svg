<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Eupho - Sound! Euphonium intro site</title>
  <desc id="desc">Kitauji teal-and-gold personal intro site with full-page sections for works, members, and instruments.</desc>

