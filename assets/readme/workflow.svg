<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">How to browse</title>
  <desc id="desc">Path from boot splash through four screens to the footer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#021c21"/>
      <stop offset="100%" stop-color="#03343c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#01acc6"/>
    </marker>
  </defs>
  <rect width="1200" height="280" rx="24" fill="url(#bg)"/>
  <text x="48" y="56" fill="#01acc6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" font-weight="600" letter-spacing="2">NAVIGATION</text>
  <text x="48" y="98" fill="#f4fbfc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="32" font-weight="800">如何浏览</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="48" y="140" width="200" height="88" rx="16" fill="#044a56" stroke="#01acc6" stroke-width="1.5"/>
    <text x="148" y="178" text-anchor="middle" fill="#fff830" font-size="18" font-weight="700">1 · Boot</text>
    <text x="148" y="206" text-anchor="middle" fill="#c8e8ee" font-size="16">开场加载</text>
    <path d="M260 184 H300" stroke="#01acc6" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="312" y="140" width="200" height="88" rx="16" fill="#044a56" stroke="#01acc6" stroke-width="1.5"/>
    <text x="412" y="178" text-anchor="middle" fill="#fff830" font-size="18" font-weight="700">2 · Seam Wipe</text>
    <text x="412" y="206" text-anchor="middle" fill="#c8e8ee" font-size="16">全屏切页</text>
    <path d="M524 184 H564" stroke="#01acc6" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="576" y="140" width="240" height="88" rx="16" fill="#044a56" stroke="#fff830" stroke-width="1.5"/>
    <text x="696" y="178" text-anchor="middle" fill="#fff830" font-size="18" font-weight="700">3 · Four Screens</text>
    <text x="696" y="206" text-anchor="middle" fill="#c8e8ee" font-size="15">作品 / 部员 / 乐器 / 介绍</text>
    <path d="M828 184 H868" stroke="#01acc6" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="880" y="140" width="240" height="88" rx="16" fill="#01acc6"/>
    <text x="1000" y="178" text-anchor="middle" fill="#021c21" font-size="18" font-weight="700">4 · Footer</text>
    <text x="1000" y="206" text-anchor="middle" fill="#021c21" font-size="16">系列横幅与收束</text>
  </g>
</svg>
