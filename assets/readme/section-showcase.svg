<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-labelledby="title desc">
  <title id="title">Four screens overview</title>
  <desc id="desc">Four full-page sections: INDEX, MEMBERS, INSTRUMENTS, INTRODUCTION.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#021c21"/>
      <stop offset="100%" stop-color="#03343c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="140" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="8" height="140" fill="#fff830"/>
  <text x="48" y="52" fill="#01acc6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" font-weight="600" letter-spacing="2">FOUR SCREENS</text>
  <text x="48" y="96" fill="#f4fbfc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="36" font-weight="800">页面一览</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15" font-weight="600">
    <rect x="360" y="42" width="180" height="56" rx="14" fill="#044a56" stroke="#01acc6" stroke-width="1.5"/>
    <text x="450" y="76" text-anchor="middle" fill="#f4fbfc">INDEX · 作品</text>
    <rect x="556" y="42" width="190" height="56" rx="14" fill="#044a56" stroke="#fff830" stroke-width="1.5"/>
    <text x="651" y="76" text-anchor="middle" fill="#fff830">MEMBERS · 部员</text>
    <rect x="762" y="42" width="210" height="56" rx="14" fill="#044a56" stroke="#01acc6" stroke-width="1.5"/>
    <text x="867" y="76" text-anchor="middle" fill="#f4fbfc">INSTRUMENTS · 乐器</text>
    <rect x="988" y="42" width="164" height="56" rx="14" fill="#01acc6"/>
    <text x="1070" y="76" text-anchor="middle" fill="#021c21">INTRO · 介绍</text>
  </g>
</svg>
